[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "max_sdk"
version = "1.4.1"
authors = [
    {name = "Ola Amigo", email = "ola-lal@example.com"},
]
description = "SDK для работы с MaxBot API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.28.1",
    "httpx>=0.24.0",
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.12.14",
    "magic_filter>=1.0.0",
    "pydantic>=1.8.0",
    "aiofiles==24.1.0",
    "puremagic==1.30",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "anyio>=4.0.0",
    "aiohttp>=3.12.14",
    "magic_filter>=1.0.0",
    "pydantic>=1.8.0",
    "aiofiles==24.1.0",
    "puremagic==1.30"

]

docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
]
