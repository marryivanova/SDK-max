image: python:3.12

stages:
  - test
  - publish
  - release

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/
  key: "${CI_COMMIT_REF_SLUG}"
  policy: pull-push

.test-setup: &test-setup
  - python -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip
  - pip install .[dev]

.test-script: &test-script
  - python -c "import max_sdk; print('Import OK')"
  - python -m pytest --cov=max_sdk --cov-report=term-missing --cov-report=xml tests/

lint:
  stage: test
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install .[dev]
  script:
    - black --check --line-length 120 .
  cache:
    paths:
      - .cache/pip
      - venv/
    key: "${CI_COMMIT_REF_SLUG}"
    policy: pull-push

test:
  stage: test
  before_script: *test-setup
  script: *test-script
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'
  cache:
    paths:
      - .cache/pip
      - venv/
    key: "${CI_COMMIT_REF_SLUG}"
    policy: pull-push

test-matrix:
  stage: test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.11", "3.12"]
  image: python:$PYTHON_VERSION
  before_script: *test-setup
  script: *test-script
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/
    expire_in: 1 week
  coverage: '/TOTAL.*\s+(\d+%)$/'
  cache:
    paths:
      - .cache/pip
      - venv/
    key: "${CI_COMMIT_REF_SLUG}-${PYTHON_VERSION}"
    policy: pull-push

publish:
  stage: publish
  cache:
    paths:
      - .cache/pip
    key: "${CI_COMMIT_REF_SLUG}"
    policy: pull
  before_script:
    - pip install --upgrade pip
  script:
    - pip install build twine
    - python -m build
    - TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/* --verbose
  only:
    - tags

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Создание релиза для версии $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Релиз версии $CI_COMMIT_TAG'

pages:
  stage: release
  image: python:3.12
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    paths:
      - .cache/pip
    key: "${CI_COMMIT_REF_SLUG}"
    policy: pull-push
  before_script:
    - pip install --upgrade pip
    - pip install .
    - pip install -r docs_requirements.txt
  script:
    - sphinx-build documentation public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_TAG